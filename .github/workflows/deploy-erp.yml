# 홈페이지 + ERP 자동 업데이트: web/ 이 바뀌면 Cloudflare Workers(taeil-erp)에 바로 올립니다.
# 필요: GitHub 저장소 Settings › Secrets and variables › Actions 에 CLOUDFLARE_API_TOKEN
#       (Cloudflare "Edit Cloudflare Workers" 템플릿 그대로, Account = 회사 계정, Zone = tigc.co.kr)
name: Deploy homepage + ERP

on:
  push:
    branches: [claude/project-thread-8bxa3u]
    paths: ['web/**', '.github/workflows/deploy-erp.yml']
  workflow_dispatch:

concurrency:
  group: deploy-erp
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: e97e75b79a77af7fd089f85e9da05d61
      WRANGLER_SEND_METRICS: 'false'
    defaults:
      run:
        working-directory: web
    steps:
      - name: Check token
        working-directory: .
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN 비밀 값이 없습니다. 저장소 Settings › Secrets › Actions 에 넣어 주세요."
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install wrangler
        run: npm install --no-save --no-fund --no-audit wrangler@4
      - name: Write wrangler.jsonc (D1 · KV 번호는 이름으로 찾음)
        run: |
          # D1 번호는 고정 (토큰에 D1 권한이 없어도 되도록)
          D1=12ddaf9a-f065-492b-b8c6-d5a1ac52d748
          KV=$(npx wrangler kv namespace list | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const x=JSON.parse(s).find(n=>n.title==='UPLOADS'||n.title.endsWith('-UPLOADS'));if(!x)process.exit(1);console.log(x.id)})")
          sed -e "s/__D1_ID__/$D1/" -e "s/__KV_ID__/$KV/" wrangler.template.jsonc > wrangler.jsonc
          echo "D1 $D1 / KV $KV"
      - name: Deploy
        run: npx wrangler deploy
      - name: Check
        run: |
          for i in $(seq 1 10); do
            if curl -fsS -D - https://erp.tigc.co.kr/api/health -o /dev/null | grep -qi 'x-taeil-server: cloudflare'; then echo OK; exit 0; fi
            sleep 3
          done
          echo "::error::erp.tigc.co.kr 확인 실패"; exit 1

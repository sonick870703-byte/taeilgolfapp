# 태일골프 라운지(대기실) 서버: lounge-server/ 가 바뀌면 Cloudflare Workers(taeil-lounge)에 올립니다.
# 주소: https://tigc.co.kr/lounge/  · 비밀 값은 홈페이지와 같은 CLOUDFLARE_API_TOKEN 을 씁니다.
name: Deploy lounge server

on:
  push:
    branches: [main, claude/project-thread-sglpit]
    paths: ['lounge-server/**', '.github/workflows/deploy-lounge.yml']
  workflow_dispatch:

concurrency:
  group: deploy-lounge
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: e97e75b79a77af7fd089f85e9da05d61
      WRANGLER_SEND_METRICS: 'false'
    defaults:
      run:
        working-directory: lounge-server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install wrangler
        run: npm install --no-save --no-fund --no-audit wrangler@4
      - name: Deploy
        run: npx wrangler deploy
      - name: Check
        run: |
          for i in $(seq 1 15); do
            if curl -fsS https://tigc.co.kr/lounge/health | grep -q taeil-lounge; then curl -sS https://tigc.co.kr/lounge/health; echo; echo OK; exit 0; fi
            sleep 4
          done
          echo "::error::https://tigc.co.kr/lounge/health 확인 실패"; exit 1
      - name: Check login proxy (wrong password must give 401, not 5xx)
        run: |
          code=$(curl -s -o /tmp/o -w '%{http_code}' -X POST https://tigc.co.kr/lounge/api/login -H 'content-type: application/json' -d '{"email":"nobody@example.com","password":"x"}')
          cat /tmp/o; echo; echo "status $code"
          [ "$code" = "401" ]

name: kr-fees
# 국내 골프장 요금 보강 (한국관광공사 TourAPI → kr-venues.json). 매주 월요일 + 수동 실행.
on:
  workflow_dispatch:
  schedule:
    - cron: '0 21 * * 0'   # 매주 월요일 06:00 (한국)
  push:
    branches: [claude/project-thread-xilp6l]
    paths: [tools/kr_tour_fees.py, .github/workflows/kr-fees.yml, services.json]
permissions:
  contents: write
concurrency: { group: kr-fees, cancel-in-progress: false }
jobs:
  fees:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: 연결 서버 점검 (관광공사 응답 원문 일부)
        continue-on-error: true
        run: |
          U=$(python3 -c "import json;print(json.load(open('services.json'))['dataProxy'])")
          curl -sL --max-time 120 "$U?api=golf&debug=1" | head -c 5000; echo
      - name: 관광공사 골프장 요금 받기·반영
        run: python3 tools/kr_tour_fees.py
      - name: 바뀐 것 저장
        run: |
          git add kr-venues.json; [ -d data ] && git add -A data || true
          if git diff --cached --quiet; then echo "변경 없음"; exit 0; fi
          git -c user.name="taeil-bot" -c user.email="noreply@tigc.co.kr" commit -m "국내 골프장 요금: 한국관광공사 관광정보 반영 ($(date -u +%F))"
          git push origin HEAD:${GITHUB_REF_NAME}
